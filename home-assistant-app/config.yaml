name: digitalSTROM MQTT (scenes)
version: "2.4.0-scene.8"
slug: digitalstrom_mqtt_scene
description: digitalSTROM MQTT bridge with scene events, built from the holli73/digitalstrom-mqtt-scene fork.
url: "https://github.com/holli73/digitalstrom-mqtt-scene/tree/master/home-assistant-app"
arch:
  - aarch64
  - amd64
init: false
services:
  - mqtt:want
ports:
  8080/tcp: null
options:
  digitalstrom_port: 8080
  digitalstrom_username: dssadmin
  digitalstrom_password: ""
  mqtt_mode: Home Assistant MQTT service
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  invert_blinds_position: false
  meterings_enabled: true
  meterings_interval_seconds: 10
  scenes_enabled: true
  log_level: INFO
  regenerate_api_key: false
schema:
  digitalstrom_host: str
  digitalstrom_port: "int(1,65535)"
  digitalstrom_username: str
  digitalstrom_password: "password?"
  mqtt_mode: "list(Home Assistant MQTT service|Manual configuration)"
  mqtt_host: "str?"
  mqtt_port: "int(1,65535)"
  mqtt_username: "str?"
  mqtt_password: "password?"
  invert_blinds_position: bool
  meterings_enabled: bool
  meterings_interval_seconds: "int(1,)"
  scenes_enabled: bool
  log_level: "list(TRACE|DEBUG|INFO|WARN|ERROR)"
  regenerate_api_key: bool
